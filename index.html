<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇 - GitHub Superpowers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    header svg { width: 32px; height: 32px; fill: #c9d1d9; }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #f0f6fc;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
    }

    .score-item {
      text-align: center;
    }

    .score-label {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .score-value {
      font-size: 28px;
      font-weight: 700;
      color: #3fb950;
      font-variant-numeric: tabular-nums;
    }

    #canvas-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13, 17, 23, 0.88);
      border-radius: 6px;
      gap: 16px;
    }

    #overlay h2 {
      font-size: 28px;
      font-weight: 700;
      color: #f0f6fc;
    }

    #overlay p {
      color: #8b949e;
      font-size: 14px;
    }

    #start-btn {
      margin-top: 8px;
      padding: 10px 28px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #start-btn:hover { background: #2ea043; }

    #controls {
      margin-top: 20px;
      display: flex;
      gap: 24px;
      color: #8b949e;
      font-size: 13px;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      padding: 0 6px;
      border: 1px solid #30363d;
      border-radius: 4px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 600;
      margin-right: 4px;
    }
  </style>
</head>
<body>

<header>
  <!-- GitHub Octocat icon -->
  <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
      0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
      -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87
      2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
      0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82
      .64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82
      .44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95
      .29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38
      A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
  </svg>
  <h1>贪吃蛇 · GitHub Superpowers</h1>
</header>

<div id="scoreboard">
  <div class="score-item">
    <div class="score-label">得分</div>
    <div class="score-value" id="score">0</div>
  </div>
  <div class="score-item">
    <div class="score-label">最高分</div>
    <div class="score-value" id="best">0</div>
  </div>
  <div class="score-item">
    <div class="score-label">级别</div>
    <div class="score-value" id="level">1</div>
  </div>
</div>

<div id="canvas-wrapper">
  <canvas id="game" width="480" height="480"></canvas>

  <div id="overlay">
    <h2 id="overlay-title">贪吃蛇</h2>
    <p id="overlay-msg">用方向键或 WASD 控制蛇的移动</p>
    <button id="start-btn">开始游戏</button>
  </div>
</div>

<div id="controls">
  <span><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动</span>
  <span><span class="key">P</span> 暂停</span>
  <span><span class="key">Space</span> 重新开始</span>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');

  const COLS = 20, ROWS = 20;
  const CELL = canvas.width / COLS;  // 24px

  // GitHub contribution graph greens
  const SNAKE_COLORS = ['#39d353', '#26a641', '#006d32', '#0e4429'];
  const FOOD_COLOR   = '#f78166';  // GitHub red
  const BONUS_COLOR  = '#e3b341';  // GitHub yellow
  const GRID_COLOR   = '#161b22';
  const BORDER_COLOR = '#21262d';

  let snake, dir, nextDir, food, bonus, score, best, level, speed, gameLoop, paused, running;

  function init() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    speed = 150;
    paused = false;
    running = true;
    bonus = null;
    bonusTimer = 0;
    updateHUD();
    placeFood();
    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(tick, speed);
    overlay.style.display = 'none';
    draw();
  }

  let bonusTimer = 0;

  function placeFood() {
    food = randomEmpty();
  }

  function randomEmpty() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y) ||
             (food && food.x === pos.x && food.y === pos.y));
    return pos;
  }

  function tick() {
    if (!running || paused) return;

    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      endGame(); return;
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame(); return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10 * level;
      placeFood();
      // Spawn bonus every 5 foods
      if (score % (50 * level) === 0) spawnBonus();
      // Level up every 50 pts base
      const newLevel = Math.floor(score / 100) + 1;
      if (newLevel > level) {
        level = newLevel;
        speed = Math.max(60, 150 - (level - 1) * 15);
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, speed);
      }
      updateHUD();
    } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
      score += 50 * level;
      bonus = null;
      bonusTimer = 0;
      updateHUD();
    } else {
      snake.pop();
      if (bonus) {
        bonusTimer--;
        if (bonusTimer <= 0) bonus = null;
      }
    }

    draw();
  }

  function spawnBonus() {
    bonus = randomEmpty();
    bonusTimer = 30; // disappears after 30 ticks
  }

  function endGame() {
    running = false;
    clearInterval(gameLoop);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
    // Flash animation
    let flashes = 0;
    const flash = setInterval(() => {
      draw(flashes % 2 === 0);
      flashes++;
      if (flashes >= 6) {
        clearInterval(flash);
        overlayTitle.textContent = '游戏结束';
        overlayMsg.textContent = `本局得分：${score}  最高分：${best}`;
        startBtn.textContent = '再玩一次';
        overlay.style.display = 'flex';
      }
    }, 120);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    if (score > best) { best = score; }
    bestEl.textContent = best;
    levelEl.textContent = level;
  }

  /* ── Drawing ── */
  function draw(highlight = false) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = BORDER_COLOR;
    ctx.lineWidth = 0.5;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CELL, 0);
      ctx.lineTo(c * CELL, canvas.height);
      ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * CELL);
      ctx.lineTo(canvas.width, r * CELL);
      ctx.stroke();
    }

    // Snake
    snake.forEach((seg, i) => {
      const ratio = i / snake.length;
      const colorIdx = Math.min(SNAKE_COLORS.length - 1, Math.floor(ratio * SNAKE_COLORS.length));
      ctx.fillStyle = highlight ? '#f0f6fc' : SNAKE_COLORS[colorIdx];
      roundRect(ctx, seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });

    // Head eyes
    if (!highlight && snake.length) {
      drawEyes(snake[0]);
    }

    // Food
    if (food) {
      drawFood(food, FOOD_COLOR, '🍎');
    }

    // Bonus
    if (bonus) {
      const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
      ctx.globalAlpha = pulse;
      drawFood(bonus, BONUS_COLOR, '⭐');
      ctx.globalAlpha = 1;
    }
  }

  function drawFood(pos, color, emoji) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(pos.x * CELL + CELL / 2, pos.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = `${CELL - 6}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, pos.x * CELL + CELL / 2, pos.y * CELL + CELL / 2 + 1);
  }

  function drawEyes(head) {
    // Determine eye positions based on direction
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const eyeOffset = CELL * 0.22;
    const pupilR = CELL * 0.07;
    const eyeR = CELL * 0.12;

    let e1, e2;
    if (dir.x === 1)  { e1 = {x: cx+eyeOffset, y: cy-eyeOffset}; e2 = {x: cx+eyeOffset, y: cy+eyeOffset}; }
    if (dir.x === -1) { e1 = {x: cx-eyeOffset, y: cy-eyeOffset}; e2 = {x: cx-eyeOffset, y: cy+eyeOffset}; }
    if (dir.y === 1)  { e1 = {x: cx-eyeOffset, y: cy+eyeOffset}; e2 = {x: cx+eyeOffset, y: cy+eyeOffset}; }
    if (dir.y === -1) { e1 = {x: cx-eyeOffset, y: cy-eyeOffset}; e2 = {x: cx+eyeOffset, y: cy-eyeOffset}; }

    [e1, e2].forEach(e => {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x, e.y, eyeR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0d1117';
      ctx.beginPath();
      ctx.arc(e.x, e.y, pupilR, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  /* ── Input ── */
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W': if (dir.y !== 1)  nextDir = {x:0,y:-1}; break;
      case 'ArrowDown':  case 's': case 'S': if (dir.y !== -1) nextDir = {x:0,y:1};  break;
      case 'ArrowLeft':  case 'a': case 'A': if (dir.x !== 1)  nextDir = {x:-1,y:0}; break;
      case 'ArrowRight': case 'd': case 'D': if (dir.x !== -1) nextDir = {x:1,y:0};  break;
      case 'p': case 'P':
        if (running) {
          paused = !paused;
          if (paused) {
            overlayTitle.textContent = '已暂停';
            overlayMsg.textContent = '按 P 继续游戏';
            startBtn.textContent = '继续';
            overlay.style.display = 'flex';
          } else {
            overlay.style.display = 'none';
          }
        }
        break;
      case ' ':
        e.preventDefault();
        if (!running || paused) init();
        break;
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  });

  // Mobile swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 20 && dir.x !== -1) nextDir = {x:1,y:0};
      if (dx < -20 && dir.x !== 1) nextDir = {x:-1,y:0};
    } else {
      if (dy > 20 && dir.y !== -1) nextDir = {x:0,y:1};
      if (dy < -20 && dir.y !== 1) nextDir = {x:0,y:-1};
    }
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener('click', init);

  // Start screen animation
  best = 0;
  bestEl.textContent = '0';
  draw();

  // Animate food on start screen
  setInterval(() => { if (!running) draw(); }, 200);
</script>
</body>
</html>
