<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 流式问答</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            margin-top: 8px;
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
            max-width: 80%;
        }

        .message.assistant .bubble {
            background: white;
            color: #333;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px 18px 18px 4px;
            max-width: 80%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .message.assistant .bubble pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message.assistant .bubble code {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
        }

        .typing-indicator {
            display: inline-block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
        }

        .input-container input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-container button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #888;
            background: #f8f9fa;
        }

        .status.connected { color: #28a745; }
        .status.error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI 流式问答</h1>
            <p>基于 Server-Sent Events 的实时流式响应</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="bubble">
                    你好！我是 AI 助手，有什么可以帮助你的吗？
                </div>
            </div>
        </div>

        <div class="status" id="status">就绪</div>

        <div class="input-container">
            <input type="text" id="queryInput" placeholder="输入你的问题..." autocomplete="off">
            <button id="sendBtn" onclick="sendQuery()">发送</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');

        let isStreaming = false;

        // 回车发送
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isStreaming) {
                sendQuery();
            }
        });

        function setStatus(text, type = '') {
            status.textContent = text;
            status.className = 'status ' + type;
        }

        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        function addTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typingMessage';
            messageDiv.innerHTML = `
                <div class="bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatContent(content) {
            // 简单的代码块格式化
            let formatted = escapeHtml(content);
            // 处理代码块
            formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // 处理行内代码
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            // 处理换行
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            queryInput.value = '';

            // 添加用户消息
            addMessage(query, 'user');

            // 添加打字指示器
            const typingDiv = addTypingIndicator();

            setStatus('AI 正在思考...', 'connected');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 移除打字指示器
                typingDiv.remove();

                // 创建 AI 回复消息
                const assistantDiv = document.createElement('div');
                assistantDiv.className = 'message assistant';
                assistantDiv.innerHTML = '<div class="bubble"></div>';
                chatContainer.appendChild(assistantDiv);
                const bubbleDiv = assistantDiv.querySelector('.bubble');

                let fullContent = '';

                // 读取流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);

                            if (data === '[DONE]') {
                                setStatus('完成', 'connected');
                                continue;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) {
                                    fullContent += parsed.content;
                                    bubbleDiv.innerHTML = formatContent(fullContent);
                                    scrollToBottom();
                                }
                                if (parsed.error) {
                                    bubbleDiv.innerHTML = `<span style="color: #dc3545;">错误: ${escapeHtml(parsed.error)}</span>`;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

            } catch (error) {
                console.error('Error:', error);
                setStatus('请求失败: ' + error.message, 'error');

                // 移除打字指示器
                const typingMsg = document.getElementById('typingMessage');
                if (typingMsg) typingMsg.remove();

                addMessage('抱歉，请求失败了，请稍后重试。', 'assistant');
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                queryInput.focus();
            }
        }

        // 页面加载时检查服务状态
        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();

                if (data.api_key_configured) {
                    setStatus('已连接 OpenAI API', 'connected');
                } else {
                    setStatus('模拟模式 (未配置 API Key)', '');
                }
            } catch (error) {
                setStatus('服务连接失败', 'error');
            }
        }

        checkHealth();
        queryInput.focus();
    </script>
</body>
</html>
